version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
    - amd64
    - '386'
    - arm
    - arm64
    ignore:
    - goos: darwin
      goarch: '386'
    main: ./cmd/opsy

archives:
  - formats: tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

signs:
  - artifacts: checksum
    args:
      - "--batch"
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).

homebrew_casks:
  - name: opsy
    binaries: [opsy]
    homepage: https://github.com/datolabs-io/opsy
    description: Your AI-Powered SRE Colleague
    license: Apache-2.0
    # The binaries are not notarized; without this macOS refuses to run them.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/opsy"]
          end
    skip_upload: auto
    commit_msg_template: "feat: opsy {{ .Tag }}"
    # The datolabs-automation App, through HOMEBREW_TAP_TOKEN, pushes the cask
    # to the tap's main branch.
    repository:
      owner: datolabs-io
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
